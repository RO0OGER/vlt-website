<section class="page">
  <div class="vlt-container">
    <p class="vlt-eyebrow">· Verband</p>
    <h1>Unser Vorstand.</h1>

    <div class="board">
      @for (m of members; track m.name) {
        <article class="member">
          <div class="member-photo">
            @if (m.photo) {
              <img [src]="m.photo" [alt]="'Portrait von ' + m.name" loading="lazy" />
            } @else {
              <span class="member-initials" aria-hidden="true">{{ initials(m.name) }}</span>
            }
          </div>

          <div class="member-body">
            <h2 class="member-name">{{ m.name }}</h2>
            @if (m.role) {
              <p class="member-role">{{ m.role }}</p>
            }

            <p class="member-fn">{{ m.ikaFunction }}</p>
            <p class="member-school">
              <a
                class="link"
                [href]="m.school.url"
                target="_blank"
                rel="noopener noreferrer"
              >{{ m.school.name }}</a>
            </p>

            <p class="member-mail">
              <a class="link link-mail" [href]="'mailto:' + m.email">
                <svg
                  class="icon-mail"
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
                E-Mail
              </a>
            </p>
          </div>
        </article>
      }
    </div>

    <p class="statutes">
      Unsere
      <a class="link link-pdf" [href]="statutes.href" target="_blank" rel="noopener noreferrer">
        <svg class="icon-pdf" width="14" height="16" viewBox="0 0 24 28" aria-hidden="true">
          <path
            fill="#e2231a"
            d="M4 0h11l7 7v18a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3Z"
          />
          <path fill="#b71c13" d="M15 0l7 7h-7V0Z" />
          <text x="12" y="21" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="Arial, sans-serif">PDF</text>
        </svg>
        Statuten
      </a>
      (Version {{ statutes.version }}) ({{ statutes.size }})
    </p>
  </div>
</section>
